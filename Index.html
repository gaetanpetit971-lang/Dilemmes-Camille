<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test des dilemmes inutiles</title>
  <style>
    :root {
      --bg1: #fff1b8;
      --bg2: #ffd6e0;
      --card: #ffffff;
      --text: #222;
      --accent: #ff4d6d;
      --accent2: #4361ee;
      --soft: #f1f1f1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 850px;
      background: var(--card);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.18);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: var(--accent);
      font-size: 2.2rem;
    }

    .subtitle {
      color: #555;
      margin-bottom: 25px;
    }

    .progress-wrap {
      background: var(--soft);
      border-radius: 999px;
      height: 18px;
      overflow: hidden;
      margin: 20px 0 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.25s ease;
    }

    .counter {
      font-weight: bold;
      margin-bottom: 25px;
    }

    .question {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 35px 0;
      line-height: 1.4;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 20px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    .choice {
      background: #ffe066;
      min-height: 90px;
    }

    .choice:hover {
      transform: translateY(-4px) scale(1.02);
      background: #ffb703;
    }

    .restart {
      margin-top: 25px;
      background: var(--accent2);
      color: white;
    }

    .hidden { display: none; }

    .result-title {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .verdict {
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .bars {
      margin-top: 25px;
      text-align: left;
    }

    .bar-line {
      margin: 18px 0;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .bar-bg {
      width: 100%;
      height: 26px;
      background: #eeeeee;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4d6d, #7209b7);
      border-radius: 999px;
      transition: width 0.8s ease;
    }

    .history {
      margin-top: 25px;
      text-align: left;
      max-height: 250px;
      overflow: auto;
      background: #fafafa;
      border-radius: 18px;
      padding: 15px;
      font-size: 0.9rem;
    }

    .history h3 { margin-top: 0; }

    @media (max-width: 650px) {
      .choices { grid-template-columns: 1fr; }
      .question { font-size: 1.25rem; }
      .app { padding: 20px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="quiz">
      <h1>Le test des dilemmes éclatés</h1>
      <p class="subtitle">100 dilemmes inutiles pour juger ta personnalité avec une rigueur scientifique proche de zéro.</p>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="counter" id="counter">Question 1 / 100</div>

      <div class="question" id="question"></div>

      <div class="choices">
        <button class="choice" id="choiceA"></button>
        <button class="choice" id="choiceB"></button>
      </div>
    </section>

    <section id="results" class="hidden">
      <h2 class="result-title" id="resultTitle"></h2>
      <p class="verdict" id="verdict"></p>
      <div class="bars" id="bars"></div>
      <div class="history" id="history"></div>
      <button class="restart" onclick="restartQuiz()">Recommencer le test</button>
    </section>
  </main>

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function startQuiz() {
      questions = shuffle(dilemmas).slice(0, 100);
      index = 0;
      scores = {};
      answers = [];
      Object.keys(categories).forEach(cat => scores[cat] = 0);
      quiz.classList.remove("hidden");
      results.classList.add("hidden");
      showQuestion();
    }

    function showQuestion() {
      const current = questions[index];
      questionEl.textContent = current.q;
      choiceA.textContent = current.a;
      choiceB.textContent = current.b;
      counter.textContent = `Question ${index + 1} / 100`;
      progressBar.style.width = `${index}%`;
    }

    function answer(side) {
      const current = questions[index];
      const chosenText = side === "a" ? current.a : current.b;
      const chosenCat = side === "a" ? current.ca : current.cb;
      scores[chosenCat]++;
      answers.push({ question: current.q, answer: chosenText, category: chosenCat });
      index++;

      if (index >= questions.length) {
        progressBar.style.width = "100%";
        showResults();
      } else {
        showQuestion();
      }
    }

    function showResults() {
      quiz.classList.add("hidden");
      results.classList.remove("hidden");

      const total = questions.length;
      const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const top = sorted[0];
      const second = sorted[1];

      const titles = {
        chaos: "Agent du chaos certifié",
        tradi: "Gardien des traditions inutiles",

      };

      const descriptions = {

        flemmard: "Tu choisis souvent la voie la plus simple. Ce n'est pas de la paresse, c'est de l'optimisation énergétique très avancée."
      };

      resultTitle.textContent = titles[top[0]];
      verdict.innerHTML = `${descriptions[top[0]]}<br><br>Ton deuxième trait dominant : <strong>${categories[second[0]]}</strong>. Donc globalement, tu es un mélange entre <strong>${categories[top[0]]}</strong> et <strong>${categories[second[0]]}</strong>. Terrible profil.`;

      bars.innerHTML = "";
      sorted.forEach(([cat, value]) => {
        const percent = Math.round((value / total) * 100);
        const line = document.createElement("div");
        line.className = "bar-line";
        line.innerHTML = `
          <div class="bar-label">
            <span>${categories[cat]}</span>
            <span>${percent}%</span>
          </div>
          <div class="bar-bg">
            <div class="bar-fill" style="width:${percent}%"></div>
          </div>
        `;
        bars.appendChild(line);
      });

      history.innerHTML = `<h3>Tes réponses</h3>` + answers.map((item, i) => `
        <p><strong>${i + 1}. ${item.question}</strong><br>${item.answer} → ${categories[item.category]}</p>
      `).join("");
    }

    function restartQuiz() {
      startQuiz();
    }

    choiceA.addEventListener("click", () => answer("a"));
    choiceB.addEventListener("click", () => answer("b"));

    startQuiz();
  </script>
</body>
</html>
